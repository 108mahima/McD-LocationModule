# Browser: edge | chrome | firefox  (override: -Dbrowser=chrome)
browser=edge
# Run without a visible window, e.g. on Jenkins (override: -Dheadless=true)
headless=false
url=https://mcdelivery.co.in/
# The desktop layout of the site needs a window at least 1200px wide
windowWidth=1366
windowHeight=900
# The McDelivery backend is slow, so explicit waits are generous (seconds)
explicitWait=45
pageLoadTimeout=90
# Retry a failed TestNG test this many times (the site is intermittently slow)
retryCount=1
testDataFile=src/test/resources/testdata/LocationTestData.xlsx
